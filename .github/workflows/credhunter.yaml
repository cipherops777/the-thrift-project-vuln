name: CredHunter Security Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CredHunter
        run: python -m pip install credhunter

      - name: Scan repository
        run: credhunter scan . --format both --fail-on low

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credhunter-reports
          path: |
            credhunter-report.json
            credhunter-report.html
          if-no-files-found: warn